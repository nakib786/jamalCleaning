# Checks (lint, formatting, type-check, build) run on every pull request and push to main.
# The Cloudflare deploy step is optional: it only runs on main when the repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist (and the variable PUBLIC_TURNSTILE_SITE_KEY
# is set), see DEPLOY.md, step 9. Without them the workflow still checks the build and stays green,
# which is the case while Cloudflare Workers Builds (the dashboard's Git integration) does the deploying.
# Use one deploy mechanism or the other, not both.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The secrets context cannot be used in a step `if`, so expose whether the token exists.
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint and format check
        run: npm run lint && npm run format:check

      - name: Build (astro check + astro build)
        run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Deploy
        if: env.HAS_CLOUDFLARE_TOKEN == 'true' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deploy skipped
        if: env.HAS_CLOUDFLARE_TOKEN != 'true' || github.event_name == 'pull_request'
        run: echo "Not deploying from GitHub Actions (no CLOUDFLARE_API_TOKEN secret, or this is a pull request)."
